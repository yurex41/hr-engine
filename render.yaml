# Render Blueprint — deploy with "New + → Blueprint" after pushing to GitHub.
services:
  - type: web
    name: hr-engine
    runtime: docker
    plan: standard        # 2 GB RAM — Chromium scraping needs headroom; 'starter' (512 MB) will OOM
    healthCheckPath: /healthz
    disk:
      name: hr-engine-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_USERS
        sync: false        # "you:pw1,friend:pw2,..." — set in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_JSON
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false        # e.g. https://hr-engine.onrender.com
